<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Krunked &amp; Fred</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #13123a;
        color: #ffffff;
        font-family: 'Courier New', Courier, monospace;
        touch-action: none;
      }
      #app {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas#game-canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        background: #13123a;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
